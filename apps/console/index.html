<!doctype html>
<html lang="zh-CN" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <script>
      (function () {
        try {
          var presets = {
            'default-system': true,
            'meshrix-crystal': true,
            'geek-light-blue': true,
            'catppuccin-latte': true,
            'github-light': true,
            'one-light': true,
            'sunset-ember': true,
            'tokyo-night': true,
            'cappuccino-dark': true,
            'gruvbox-dark': true,
            'dracula': true,
            'nord': true,
            'monokai': true,
            'cyberpunk': true
          };
          var preset = localStorage.getItem('meshrix-appearance-preset');
          if (!presets[preset]) {
            preset = 'default-system';
            localStorage.setItem('meshrix-appearance-preset', preset);
          }
          document.documentElement.dataset.appearancePreset = preset;
        } catch (e) {}
      })();
    </script>
    <title>Meshrix.js &mdash; Traceable Shared Workspace for AI Agents</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body translate="no" class="notranslate">
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
