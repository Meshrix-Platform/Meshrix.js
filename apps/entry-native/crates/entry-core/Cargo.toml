[package]
name = "meshrix-entry-core"
description = "Native Rust core for the Meshrix Entry client — identity, custody, recovery, pairing, private-relay transport."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
thiserror.workspace = true
tracing.workspace = true

ed25519-dalek.workspace = true
hkdf.workspace = true
sha2.workspace = true
aes-gcm.workspace = true
rand.workspace = true
base64.workspace = true
zeroize.workspace = true

rustls.workspace = true
rustls-pki-types.workspace = true
rustls-native-certs.workspace = true
tokio-rustls.workspace = true
x509-parser.workspace = true
tokio-tungstenite.workspace = true
ureq.workspace = true
url.workspace = true
urlencoding.workspace = true
http.workspace = true
futures-util.workspace = true
tokio-util = { version = "0.7", features = ["compat"] }
webpki-roots.workspace = true
directories.workspace = true
chrono.workspace = true
libsignal-protocol.workspace = true
async-trait.workspace = true
a4aa.workspace = true
awp.workspace = true
a4aa-dialects.workspace = true
libc.workspace = true
gethostname = "1.1.0"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
hex = "0.4"
tempfile = "3"
