[package]
name = "meshrix-entry"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Meshrix Entry — installed entry product. Thin Tauri shell owning the window and the Node.js sidecar lifecycle; product logic lives in the Node backend service."
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
dirs = "6"
tokio = { version = "1", features = ["time"] }

[profile.release]
# The shell stays thin; keep the bundled artifact small.
lto = true
codegen-units = 1
