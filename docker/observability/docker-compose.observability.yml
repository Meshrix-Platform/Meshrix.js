# Meshrix operator observability overlay.
# Runs Prometheus (time-series) + Grafana (dashboards) beside a deployed
# Meshrix stack. Joins the existing compose network so it can scrape the
# private relay's GET /admin/metrics exposition.
#
# Required deploy-secrets (never committed):
#   RELAY_ADMIN_TOKEN_FILE — file containing the relay admin bearer token,
#                            mounted at /run/secrets/relay_admin_token
#   MESHRIX_CORE_NETWORK   — name of the network the relay is attached to
#                            (default: meshrix-src_meshrix-core)
#
# Deploy (alongside the base + windows overlays):
#   docker compose -f docker-compose.yml -f docker-compose.windows.yml \
#     -f docker/observability/docker-compose.observability.yml up -d
#
# Grafana: http://127.0.0.1:3000 (admin/admin on first login — change it).

services:
  prometheus:
    image: docker.io/prom/prometheus:v3.5.0
    container_name: meshrix-prometheus
    restart: unless-stopped
    init: true
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${RELAY_ADMIN_TOKEN_FILE:?set RELAY_ADMIN_TOKEN_FILE}:/run/secrets/relay_admin_token:ro
      - meshrix-prometheus-tsdb:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - meshrix-core

  grafana:
    image: docker.io/grafana/grafana:12.1.0
    container_name: meshrix-grafana
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - meshrix-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - meshrix-core

volumes:
  meshrix-prometheus-tsdb:
  meshrix-grafana-data:

networks:
  meshrix-core:
    external: true
    name: ${MESHRIX_CORE_NETWORK:-meshrix-src_meshrix-core}
