# Local development configuration for the Meshrix private relay Worker.
# This file is NOT a deployment manifest: `wrangler dev --local` and the
# vitest-pool-workers suite are the only supported consumers. Do not run
# `wrangler deploy`; engineering checks use local Workerd only.
name = "meshrix-private-relay"
main = "src/index.ts"
# Pinned to the bundled local workerd runtime's supported date (workerd
# 2026-08-15 supports up to 2026-08-22); this is a local-only check surface.
compatibility_date = "2026-08-15"
# The shared wire contract uses Buffer.byteLength for bounded string checks;
# nodejs_compat exposes the standard Buffer implementation in workerd.
compatibility_flags = ["nodejs_compat"]

# Local-only provisioning token for the administrative enrollment/revocation
# and vault-provisioning routes. Synthetic placeholder for local checks;
# production provisioning is a separate authorized delivery.
[vars]
RELAY_ADMIN_TOKEN = "local-only-synthetic-admin-token"
# Private/self-hosted shape explicitly opens the bearer-gated admin surface
# (loopback, LAN, tailnet, local checks). Unset would mean "off" — the
# closed default every public deployment must keep.
RELAY_ADMIN_SURFACE = "local"
# Synthetic ticket key for local checks only: lets the stateless credential
# gate run end-to-end in tests/dev. Public deployments use a real
# `wrangler secret put RELAY_TICKET_SECRET`; self-hosted private surfaces
# may also omit it (bare-token shape).
RELAY_TICKET_SECRET = "local-only-synthetic-ticket-secret"
# Synthetic invite *verification* key for local checks only — an Ed25519
# public key (base64url raw), so committing it is correct even on real
# deployments: the relay can verify invitations but can never mint them.
# The matching synthetic private key lives in test/helpers.ts for the
# suite; real issuers generate their own pair via `tools/invite-mint.mjs
# keygen` and publish only the public half. Unset → redemption closed.
RELAY_INVITE_PUBLIC_KEY = "s62QRUuvbgXe-pM7WyyHBtjiMS-XWVrZ4IMOEwgWRHg"
RELAY_MAX_SESSION_MESSAGE_BYTES = "393216"
RELAY_MAX_VAULT_MESSAGE_BYTES = "1572864"
# Deployment-selected peer mailbox retention policy: finite byte capacity,
# retention window and item bound, advertised at session admission via
# peer-retention-policy. Bounds stay inside the wire contract's
# PRIVATE_RELAY_PEER_LIMITS (<= 1 GiB / <= 365 d / <= 1 000 000 items).
RELAY_MAILBOX_CAPACITY_BYTES = "16777216"
RELAY_MAILBOX_RETENTION_MS = "2592000000"
RELAY_MAILBOX_MAX_ITEMS = "4096"

[durable_objects]
bindings = [
  { name = "RELAY_DIRECTORY", class_name = "RelayDirectoryDO" },
  { name = "RELAY_SESSION", class_name = "RelaySessionDO" },
  { name = "RECOVERY_VAULT", class_name = "RecoveryVaultDO" },
  { name = "RELAY_MAILBOX", class_name = "MailboxDO" }
]

# SQLite-backed Durable Object storage for transactional relay state.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDirectoryDO", "RelaySessionDO", "RecoveryVaultDO"]

# Peer mailbox partitions (NODE-MAILBOX-RUNTIME).
[[migrations]]
tag = "peer"
new_sqlite_classes = ["MailboxDO"]

# ── Named environment: staging (shape only, no real account) ────────────────
# Wrangler named environments do NOT inherit top-level bindings, vars or
# migrations, so the staging profile restates them deliberately. `main`,
# `compatibility_date` and `compatibility_flags` remain inherited from the
# top-level configuration.
#
# Staging is the authorized Cloudflare deployment shape (Workers Free plan,
# account 4463b244…175e1): `wrangler deploy --env staging` publishes the real
# worker and creates the relay.meshrix.io custom-domain route; the edge
# certificate is Cloudflare-provisioned. RELAY_ADMIN_TOKEN is a real secret
# installed via `wrangler secret put` — it is never committed as a var.
[env.staging]
name = "meshrix-private-relay-staging"
account_id = "4463b244fa145a838d0a3b44bdb175e1"
# No workers.dev route: it would be an unmanaged entry point that never
# traverses the custom domain's protections (Access policy, WAF posture).
# relay.meshrix.io is the only intentional way in.
workers_dev = false
# No per-version preview URLs: they would be an unmanaged extra entry
# point serving this worker outside the intentional routes.
preview_urls = false

# Custom domain on the user's own zone: Cloudflare issues and renews the
# edge certificate automatically — no ACME, no manual generation. The DNS
# record is created by `wrangler deploy` (Workers Routes: write scope).
[[env.staging.routes]]
pattern = "relay.meshrix.io"
custom_domain = true

[env.staging.vars]
RELAY_MAX_SESSION_MESSAGE_BYTES = "393216"
RELAY_MAX_VAULT_MESSAGE_BYTES = "1572864"
RELAY_MAILBOX_CAPACITY_BYTES = "16777216"
RELAY_MAILBOX_RETENTION_MS = "2592000000"
RELAY_MAILBOX_MAX_ITEMS = "4096"
# Workers mode never persists billing counters: every flushed counter write
# is a billed Durable Object storage write, so counters stay in memory here
# (zero counter writes to DO SQLite). The /admin/metrics exposition still
# serves the real values, honestly labeled scope="ephemeral". Self-hosted
# shapes keep the durable default (top-level [vars] intentionally unset).
RELAY_METRICS_DURABLE = "0"
# The control plane must never ride a public route: staging leaves
# RELAY_ADMIN_SURFACE unset, so /admin/* does not exist on the edge at all
# (404 — stronger than a credential gate). When the operator needs remote
# admin on this deployment, the correct shape is a Cloudflare
# Access-protected hostname plus RELAY_ADMIN_SURFACE="access" with a
# verified JWT (RELAY_ACCESS_TEAM + RELAY_ACCESS_AUD); workers.dev is
# disabled, so there is no bypass route.
# RELAY_ADMIN_TOKEN is intentionally absent here: a real deployment provides
# it through `wrangler secret put` under authorized ownership; provisioning
# tokens are never committed as vars.
# Invite admission is key-separated: staging needs only the issuer's
# Ed25519 *public* key as RELAY_INVITE_PUBLIC_KEY (a var — public material),
# while the signing private key stays offline with the invitation
# authority. RELAY_TICKET_SECRET remains the one secret requiring
# `wrangler secret put`.

[env.staging.durable_objects]
bindings = [
  { name = "RELAY_DIRECTORY", class_name = "RelayDirectoryDO" },
  { name = "RELAY_SESSION", class_name = "RelaySessionDO" },
  { name = "RECOVERY_VAULT", class_name = "RecoveryVaultDO" },
  { name = "RELAY_MAILBOX", class_name = "MailboxDO" }
]

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDirectoryDO", "RelaySessionDO", "RecoveryVaultDO"]

[[env.staging.migrations]]
tag = "peer"
new_sqlite_classes = ["MailboxDO"]
