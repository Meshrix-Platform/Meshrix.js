version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: nightly
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
  - package-ecosystem: github-actions
    directory: /
    target-branch: nightly
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
