version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: nightly
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    versioning-strategy: increase-if-necessary
    groups:
      routine-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    target-branch: nightly
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      routine-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
