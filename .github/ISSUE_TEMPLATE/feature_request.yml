name: Feature request
description: Propose a capability or a change to a public contract.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem and observable outcome. Do not include private deployment data, credentials, or confidential product information.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and public documentation for this request.
          required: true
        - label: This request contains no secrets, personal data, private hosts, or production payloads.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and acceptance criteria without prescribing an internal implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      options:
        - Core runtime
        - Operation Permission
        - HTTP or RPC protocol
        - MCP gateway or connector
        - Console UI
        - Plugin runtime
        - Storage or jobs
        - Documentation or tooling
        - Other
    validations:
      required: true
