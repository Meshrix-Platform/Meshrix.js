# Publish the packages and GitHub Release from one tagged source revision.
name: Release

env:
  NODE_OPTIONS: --conditions=source

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish release
    runs-on: macos-15
    environment: release-candidate
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Provide the Go toolchain for service verification
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/file-parser/format-convert/go.mod

      - name: Use the repository-configured npm CLI for Trusted Publishing
        run: npm install --global "npm@$(node -p 'require("./tools/registry/release-definition.registry.json").github.npmCliVersion')"

      - name: Install dependencies
        run: npm ci
      - name: Install the locked Chromium browser and system dependencies
        run: npm exec --offline -- playwright install --with-deps chromium

      - name: Check the tag against the release packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:prepare -- --check --tag "$RELEASE_TAG"

      - name: Build, test, and qualify the npm archives
        run: npm run ci:local -- --report build/ci-diagnostics/release-local-ci/results.json

      - name: Publish the qualified npm archives
        env:
          # Trusted Publishing through the workflow's OIDC identity
          # (`id-token: write` above); no long-lived npm token is used.
          NPM_CONFIG_PROVENANCE: "true"
        run: npm run release:publish-npm -- --artifact-dir build/release/npm-set

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release already exists for $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --title "Meshrix.js $RELEASE_TAG" --generate-notes
          fi

      - name: Retain sanitized release diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-diagnostics-${{ github.sha }}
          path: |
            build/ci-diagnostics/release-local-ci/results.json
            build/local-ci/
            build/reports/npm-package-installability.json
            build/acceptance-evidence/failures/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
