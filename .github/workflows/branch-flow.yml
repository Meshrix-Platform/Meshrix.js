# Public clean-rebuild workflow registration anchor.
name: Branch flow

env:
  NODE_OPTIONS: --conditions=source

on:
  push:
    branches: ["nightly", "stable", "release"]
  pull_request:
    branches: ["nightly", "stable", "release"]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-flow-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Use GitHub's platform execution limit. Preserve healthy work instead of
# discarding it at a shorter local deadline; failures or operator cancellation stop it.
jobs:
  branch-flow:
    name: Branch flow policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.21.0"
      - name: Verify branch flow
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/scripts/verify-branch-flow.ts
      - name: Verify published tree
        run: node tools/scripts/verify-git-publication.ts --index
