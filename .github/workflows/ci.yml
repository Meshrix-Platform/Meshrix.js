# Public clean-rebuild workflow registration anchor.
name: CI

on:
  push:
    branches: ["nightly", "stable", "release"]
    tags: ["v*"]
  pull_request:
    branches: ["nightly", "stable", "release"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-gate:
    name: Public platform gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Core repository gate
        run: npm run verify
      - name: Vitest suite
        run: npm run vitest
      - name: Audit gate
        if: ${{ github.event_name == 'push' && (github.ref_name == 'stable' || github.ref_name == 'release' || startsWith(github.ref, 'refs/tags/v')) }}
        run: npm run test:audit

  platform-acceptance:
    name: Canonical platform acceptance
    needs: [public-gate]
    if: ${{ github.event_name == 'push' && (github.ref_name == 'stable' || github.ref_name == 'release') }}
    runs-on: ubuntu-latest
    timeout-minutes: 395
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Platform acceptance authority
        env:
          LICO_RELEASE_PARALLELISM: "4"
        run: npm run verify:acceptance

  node-22-compatibility:
    name: Supported Node 22 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Core repository gate
        run: npm run verify

  npm-package-portability:
    name: npm package portability (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22"
            mode: host
            timeout: 15
          - os: ubuntu-latest
            node: "24"
            mode: container
            timeout: 60
          - os: macos-latest
            node: "24"
            mode: host
            timeout: 15
          - os: windows-latest
            node: "24"
            mode: host
            timeout: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - name: Run the fresh-container package authority
        if: ${{ matrix.mode == 'container' }}
        run: npm run verify:npm-package-installability
      - name: Run the supplementary clean-host package probe
        if: ${{ matrix.mode == 'host' }}
        run: npm run verify:npm-package-installability -- --host-platform-probe

  windows-installer-security:
    name: Windows installer security
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Verify PowerShell launcher syntax, delegation, and fail-closed inputs
        shell: pwsh
        run: |
          $installer = (Resolve-Path "packages/protocols/mcp/adapter/native-installer/lico-mcp-install.ps1").Path
          $connector = (Resolve-Path "packages/protocols/mcp/adapter/gateway-installer/bin/lico-mcp.mjs").Path
          $env:LICO_MCP_CONNECTOR = $connector

          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($installer, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw "PowerShell installer syntax validation failed" }

          function Invoke-InstallerProcess([string[]]$Arguments) {
            $start = [System.Diagnostics.ProcessStartInfo]::new("pwsh")
            $start.UseShellExecute = $false
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            $start.Environment["LICO_MCP_CONNECTOR"] = $connector
            $start.ArgumentList.Add("-NoLogo")
            $start.ArgumentList.Add("-NoProfile")
            $start.ArgumentList.Add("-File")
            $start.ArgumentList.Add($installer)
            foreach ($argument in $Arguments) { $start.ArgumentList.Add($argument) }
            $process = [System.Diagnostics.Process]::Start($start)
            $stdout = $process.StandardOutput.ReadToEnd()
            $stderr = $process.StandardError.ReadToEnd()
            $process.WaitForExit()
            return @{ ExitCode = $process.ExitCode; Output = "$stdout`n$stderr" }
          }

          $version = Invoke-InstallerProcess -Arguments @("-Command", "version", "-Json")
          if ($version.ExitCode -ne 0 -or $version.Output -notmatch '"packageName":"lico-mcp-connector"') {
            throw "PowerShell installer did not delegate to the repository connector"
          }

          $invalidTokenProbe = "installer-invalid-token-sentinel"
          $rawToken = Invoke-InstallerProcess -Arguments @("-Command", "doctor", "-Json", "-Token", $invalidTokenProbe)
          if ($rawToken.ExitCode -eq 0 -or $rawToken.Output.Contains($invalidTokenProbe)) {
            throw "PowerShell installer did not reject and redact a raw token argument"
          }

          $canary = Join-Path $env:RUNNER_TEMP "lico-token-env-injection-canary"
          Remove-Item -LiteralPath $canary -Force -ErrorAction SilentlyContinue
          $invalidEnv = Invoke-InstallerProcess -Arguments @("-Command", "doctor", "-Json", "-TokenEnv", "BAD;New-Item $canary")
          if ($invalidEnv.ExitCode -eq 0 -or (Test-Path -LiteralPath $canary)) {
            throw "PowerShell installer accepted an unsafe token environment name"
          }

      - name: Verify Windows current-user DPAPI credential custody
        shell: pwsh
        run: npm run verify:mcp-windows-process-identity-credential-store

  supply-chain:
    name: Supply-chain evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependency graph without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit build and development dependencies
        run: npm audit --audit-level=high
      - name: Verify pinned Node runtime checksum signature
        run: node tools/server-scripts/verify-node-runtime-supply-chain.mjs
      - name: Generate reproducible SBOM and third-party notices
        run: node tools/generators/generate-supply-chain-artifacts.mjs
      - name: Verify supply-chain artifacts and negative cases
        run: node tools/verifiers/verify-supply-chain-artifacts.mjs --self-test
      - name: Upload verified supply-chain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-node-24
          path: |
            build/reports/supply-chain/
            build/reports/node-runtime-supply-chain.json
          if-no-files-found: error
          retention-days: 30

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
