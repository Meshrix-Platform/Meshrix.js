# Public clean-rebuild workflow registration anchor.
name: CI

env:
  NODE_OPTIONS: --conditions=source

on:
  push:
    branches: ["nightly", "stable", "release"]
  pull_request:
    branches: ["nightly", "stable", "release"]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single-platform npm qualification per AGENTS.md: an npm release may be
  # qualified on one or two available platforms; native Ubuntu, containers, or
  # VM coverage is not a universal publication prerequisite. The qualification
  # environment matches the release pipeline (release.yml runs on macos-15):
  # device-gated checks (installed MCP hub, browser launch) pass there.
  pull-request-verify:
    name: Pull request verification
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.21.0"
          cache: "npm"
      - name: Provide the Go toolchain for service verification
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/file-parser/format-convert/go.mod
      - name: Use the repository-configured npm CLI
        run: node tools/server-scripts/install-release-npm-cli.ts
      - name: Install dependencies
        run: npm ci
      - name: Install the locked Chromium browser and system dependencies
        run: npm exec --offline -- playwright install --with-deps chromium
      - name: Run the maintained engineering entry
        run: npm run ci:local -- --report build/ci-diagnostics/local-ci/results.json
      - name: Retain sanitized logs and structured results
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pull-request-engineering-${{ github.sha }}
          path: |
            build/ci-diagnostics/local-ci/results.json
            build/local-ci/
            build/reports/npm-package-installability.json
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  engineering:
    name: Engineering verification
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.21.0"
          cache: "npm"
      - name: Provide the Go toolchain for service verification
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/file-parser/format-convert/go.mod
      - name: Use the repository-configured npm CLI
        run: node tools/server-scripts/install-release-npm-cli.ts
      - name: Install dependencies
        run: npm ci
      - name: Install the locked Chromium browser and system dependencies
        run: npm exec --offline -- playwright install --with-deps chromium
      - name: Run the maintained engineering entry
        run: npm run ci:local -- --report build/ci-diagnostics/local-ci/results.json
      - name: Retain sanitized logs and structured results
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: engineering-${{ github.sha }}
          path: |
            build/ci-diagnostics/local-ci/results.json
            build/local-ci/
            build/reports/npm-package-installability.json
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
