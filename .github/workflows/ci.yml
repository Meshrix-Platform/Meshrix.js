# Public clean-rebuild workflow registration anchor.
name: CI

env:
  NODE_OPTIONS: --conditions=source

on:
  push:
    branches: ["nightly", "stable", "release"]
    tags: ["v*"]
  pull_request:
    branches: ["nightly", "stable", "release"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-gate:
    name: Public platform gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Rebuild local plan baseline
        run: node tools/plan/rebuild-current-plan-baseline.ts
      - name: Core repository gate
        run: npm run verify
      - name: Vitest suite
        run: npm run vitest
      - name: Audit gate
        if: ${{ github.event_name == 'push' && (github.ref_name == 'stable' || github.ref_name == 'release' || startsWith(github.ref, 'refs/tags/v')) }}
        run: npm run test:audit

  functional-completeness:
    name: Functional completeness release gate
    needs: [public-gate]
    if: ${{ github.event_name == 'push' && (github.ref_name == 'stable' || github.ref_name == 'release') }}
    runs-on: ubuntu-latest
    timeout-minutes: 395
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Produce enterprise single-node delivery receipt in Ubuntu
        run: npm run verify:enterprise-single-node:ubuntu-container
      - name: Functional-complete authority
        env:
          MESHRIX_RELEASE_PARALLELISM: "4"
        run: >-
          node tools/server-scripts/verify-platform-acceptance.ts
          --profile enterprise-single-node

  node-22-compatibility:
    name: Supported Node 22 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Rebuild local plan baseline
        run: node tools/plan/rebuild-current-plan-baseline.ts
      - name: Core repository gate
        run: npm run verify

  npm-package-portability:
    name: Fresh-container npm package simulation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install verifier workspace dependencies
        run: npm ci --ignore-scripts
      - name: Run the fresh-container package authority
        run: npm run verify:npm-package-installability

  supply-chain:
    name: Supply-chain evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependency graph without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit build and development dependencies
        run: npm audit --audit-level=high
      - name: Verify pinned Node runtime checksum signature
        run: node tools/server-scripts/verify-node-runtime-supply-chain.ts
      - name: Generate reproducible SBOM and third-party notices
        run: node tools/generators/generate-supply-chain-artifacts.ts
      - name: Verify supply-chain artifacts and negative cases
        run: node tools/verifiers/verify-supply-chain-artifacts.ts --self-test
      - name: Upload verified supply-chain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-node-24
          path: |
            build/reports/supply-chain/
            build/reports/node-runtime-supply-chain.json
          if-no-files-found: error
          retention-days: 30

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
