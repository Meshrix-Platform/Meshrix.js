name: version-governance

on:
  pull_request:
  push:
    tags:
      - "v*.*.*"
      - "*-v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  version-governance:
    uses: LicoLand/.github/.github/workflows/reusable-version-governance.yml@cbc1c4730d33ad15f6d7054939effaae93d79ec5
    with:
      governance_ref: "cbc1c4730d33ad15f6d7054939effaae93d79ec5"
      target_repository: ${{ github.repository }}
      target_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      expected_repository: ${{ github.repository }}
      plan_path: docs/releases/plan.json
      tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      require_tag: ${{ github.ref_type == 'tag' }}
