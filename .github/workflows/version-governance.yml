name: version-governance

on:
  pull_request:
  push:
    tags:
      - "v*.*.*"
      - "*-v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  version-governance:
    uses: LicoLand/.github/.github/workflows/reusable-version-governance.yml@834d4ee338062475b3401400e12c573fb05b4130
    with:
      governance_ref: "834d4ee338062475b3401400e12c573fb05b4130"
      target_repository: ${{ github.repository }}
      target_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      expected_repository: ${{ github.repository }}
      plan_path: docs/releases/plan.json
      tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      require_tag: ${{ github.ref_type == 'tag' }}
