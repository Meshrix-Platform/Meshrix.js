name: Dependabot security auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  classify:
    name: Classify security update
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Remove stale auto-merge eligibility
        env:
          AUTOMERGE_LABEL: dependabot-automerge
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if gh pr view "$PR_URL" --json labels --jq '.labels[].name' | grep -Fxq "$AUTOMERGE_LABEL"; then
            gh pr edit "$PR_URL" --remove-label "$AUTOMERGE_LABEL"
          fi

      - name: Read verified Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3

      - name: Mark patch and minor updates for auto-merge
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          AUTOMERGE_LABEL: dependabot-automerge
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-label "$AUTOMERGE_LABEL"

  merge:
    name: Merge admitted security update
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request'
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        github.event.pull_request.user.login == 'dependabot[bot]' &&
        github.event.pull_request.base.ref == 'nightly'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Merge the exact admitted Dependabot revision
        env:
          AUTOMERGE_LABEL: dependabot-automerge
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            pr_number=$(jq -r \
              '.workflow_run.pull_requests | if length == 1 then .[0].number else empty end' \
              "$GITHUB_EVENT_PATH")
            verified_head_sha="$WORKFLOW_HEAD_SHA"
          else
            pr_number=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
            verified_head_sha=$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
          fi
          if [ -z "$pr_number" ] || [ -z "$verified_head_sha" ]; then
            exit 0
          fi

          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")
          author=$(printf '%s' "$pr" | jq -r '.user.login')
          base=$(printf '%s' "$pr" | jq -r '.base.ref')
          head_sha=$(printf '%s' "$pr" | jq -r '.head.sha')
          state=$(printf '%s' "$pr" | jq -r '.state')
          eligible=$(printf '%s' "$pr" | jq -r \
            --arg admission_label "$AUTOMERGE_LABEL" \
            '[.labels[].name] | index($admission_label) != null')

          if [ "$author" != 'dependabot[bot]' ] || \
             [ "$base" != 'nightly' ] || \
             [ "$state" != 'open' ] || \
             [ "$eligible" != 'true' ] || \
             [ "$head_sha" != "$verified_head_sha" ]; then
            exit 0
          fi

          # A label and a clean scan are not admission. The exact proposed
          # revision needs a current non-dismissed approving review from an
          # authorized maintainer; a later changes-requested or dismissed
          # review revokes the conclusion. Repository association is not write authority;
          # query current repository permissions before using a review.
          reviews=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/reviews?per_page=100")
          latest_reviews=$(printf '%s' "$reviews" | jq -c '
            add
            | map(select(.user.type == "User" and
                (.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")))
            | sort_by(.user.login, .id)
            | group_by(.user.login)
            | map(last)')
          approved=false
          rejected=false
          while IFS= read -r review; do
            reviewer=$(printf '%s' "$review" | jq -r '.user.login')
            permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${reviewer}/permission" --jq '.permission')
            case "$permission" in write|admin) ;; *) continue ;; esac
            review_state=$(printf '%s' "$review" | jq -r '.state')
            review_head=$(printf '%s' "$review" | jq -r '.commit_id')
            if [ "$review_state" = 'CHANGES_REQUESTED' ]; then
              rejected=true
            elif [ "$review_state" = 'APPROVED' ] && [ "$review_head" = "$head_sha" ]; then
              approved=true
            fi
          done < <(printf '%s' "$latest_reviews" | jq -c '.[]')
          if [ "$approved" != 'true' ] || [ "$rejected" = 'true' ]; then
            exit 0
          fi

          # Elapsed checks are read for the same head, so an admission review
          # that arrives after CI does not require a redundant CI run, and the
          # head cannot change between the check and the merge request.
          checks=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs?per_page=100")
          for required_job in \
            'Pull request verification' \
            'Dependency review'; do
            conclusion=$(printf '%s' "$checks" | jq -r \
              --arg name "$required_job" \
              '[.[].check_runs[] | select(.name == $name and .app.slug == "github-actions")] | sort_by(.id) | if length > 0 then last.conclusion else "missing" end')
            if [ "$conclusion" != 'success' ]; then
              exit 0
            fi
          done

          gh pr merge "https://github.com/${GITHUB_REPOSITORY}/pull/${pr_number}" \
            --squash \
            --delete-branch \
            --match-head-commit "$head_sha"
