# Public clean-rebuild workflow registration anchor.
name: Release branch promotion

env:
  NODE_OPTIONS: --conditions=source

on:
  push:
    branches: ["release"]
  workflow_dispatch:
    inputs:
      bootstrap_candidate:
        description: "Exact canonical version for the first npm publication"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-branch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-authority:
    name: Prepare and dispatch release authority
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.16.0"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Read the canonical release definition
        id: release-definition
        run: node tools/server-scripts/release-workflow-automation.ts release-definition-outputs
      - name: Pin the canonical npm CLI
        run: node tools/server-scripts/release-workflow-automation.ts pin-npm-cli
      - name: Validate the canonical package version
        run: npm run release:prepare -- --check --tag ${{ steps.release-definition.outputs.release_tag }}
      - name: Materialize this release branch candidate
        run: node tools/server-scripts/verify-release-candidate-identity.ts --output build/release/control/expected/SOURCE_CANDIDATE.json
      - name: Resolve and materialize the exact stable and release authority
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_CANDIDATE: ${{ inputs.bootstrap_candidate || '' }}
        run: node tools/server-scripts/release-workflow-automation.ts prepare-branch-authority
      - name: Export the exact release authority bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-authority-${{ github.sha }}
          path: build/release/control/release-authority/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true
      - name: Create or verify the immutable canonical version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/server-scripts/release-workflow-automation.ts ensure-release-tag
      - name: Dispatch the single release publisher when this version is eligible
        if: ${{ steps.authority.outputs.dispatch_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_CANDIDATE: ${{ inputs.bootstrap_candidate || '' }}
        run: node tools/server-scripts/release-workflow-automation.ts dispatch-release
