# Public clean-rebuild workflow registration anchor.
name: Release branch deployment

env:
  NODE_OPTIONS: --conditions=source

on:
  push:
    branches: ["release"]
  workflow_dispatch:
    inputs:
      bootstrap_candidate:
        description: "Exact canonical version to use for the first npm publication"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-branch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-deployment:
    name: Runtime-ui external deployment smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.release-definition.outputs.release_tag }}
      release_version: ${{ steps.release-definition.outputs.release_version }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.16.0"
          cache: "npm"
      - name: Pin the canonical npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(node -p 'JSON.parse(require("node:fs").readFileSync("tools/registry/release-definition.registry.json", "utf8")).github.npmCliVersion')"
          npm install --global --no-audit --no-fund --ignore-scripts --registry=https://registry.npmjs.org/ "npm@${npm_version}"
          test "$(npm --version)" = "$npm_version"
      - name: Install dependencies
        run: npm ci
      - name: Require the release branch ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = branch
          test "$GITHUB_REF_NAME" = release
      - name: Validate the canonical release definition
        id: release-definition
        shell: bash
        env:
          BOOTSTRAP_CANDIDATE: ${{ github.event.inputs.bootstrap_candidate || '' }}
        run: |
          set -euo pipefail
          npm run verify:release-definition
          npm run release:prepare -- --check
          release_tag="$(node tools/server-scripts/verify-release-definition.ts --field release.tag)"
          release_version="$(node tools/server-scripts/verify-release-definition.ts --field release.version)"
          if [[ -n "$BOOTSTRAP_CANDIDATE" && "$BOOTSTRAP_CANDIDATE" != "$release_version" ]]; then
            echo "The bootstrap candidate must exactly match the canonical release version." >&2
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
      - name: Require release to equal the current stable tip
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/stable^{commit})"
      - name: Independently materialize the checkout candidate
        run: >-
          node tools/server-scripts/verify-release-candidate-identity.ts
          --output build/release/control/expected/SOURCE_CANDIDATE.json
      - name: Resolve the successful stable complete-gate run for this commit
        id: stable-run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$RUNNER_TEMP/stable-runs.json"
          selected="$RUNNER_TEMP/stable-run.json"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs?event=push&branch=stable&head_sha=${GITHUB_SHA}&per_page=100" \
            --slurp | jq '{workflow_runs: [.[] | .workflow_runs[]]}' > "$runs"
          node tools/server-scripts/resolve-branch-promotion-authority.ts select-run \
            --input "$runs" \
            --workflow-path .github/workflows/ci.yml \
            --branch stable \
            --head-sha "$GITHUB_SHA" \
            --output "$selected"
          run_id="$(jq -r .runId "$selected")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "selection=$selected" >> "$GITHUB_OUTPUT"
      - name: Resolve exactly one stable authority artifact
        id: stable-artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          inventory="$RUNNER_TEMP/stable-artifacts.json"
          selected="$RUNNER_TEMP/stable-artifact.json"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${{ steps.stable-run.outputs.run_id }}/artifacts?per_page=100" \
            --slurp | jq '{artifacts: [.[] | .artifacts[]]}' > "$inventory"
          node tools/server-scripts/resolve-branch-promotion-authority.ts select-artifact \
            --input "$inventory" \
            --artifact-name "stable-authority-${GITHUB_SHA}" \
            --output "$selected"
          echo "artifact_id=$(jq -r .artifactId "$selected")" >> "$GITHUB_OUTPUT"
      - name: Download the stable candidate authority bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/stable-authority.zip"
          bundle="build/release/control/stable-authority"
          mkdir -p "$bundle"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ steps.stable-artifact.outputs.artifact_id }}/zip" > "$archive"
          unzip -q "$archive" -d "$bundle"
          node tools/server-scripts/resolve-branch-promotion-authority.ts verify-stable-bundle \
            --bundle "$bundle" \
            --expected-candidate build/release/control/expected/SOURCE_CANDIDATE.json \
            --run "${{ steps.stable-run.outputs.selection }}"
      - name: Verify the external runtime-ui deployment
        run: >-
          npm run server:verify:release-deployment --
          --source-candidate build/release/control/stable-authority/SOURCE_CANDIDATE.json
          --functional-receipt build/release/control/stable-authority/accepted-candidate.json
          --output build/reports/release-deployment.json
          --cleanup-state "$RUNNER_TEMP/release-deployment-cleanup.json"
      - name: Remove exact run-scoped deployment resources
        if: ${{ always() }}
        run: >-
          node tools/server-scripts/verify-release-deployment.ts
          --cleanup-only
          --cleanup-state "$RUNNER_TEMP/release-deployment-cleanup.json"
      - name: Assemble the release authority bundle
        shell: bash
        run: |
          set -euo pipefail
          stable="build/release/control/stable-authority"
          bundle="build/release/control/release-authority"
          mkdir -p "$bundle"
          cp "$stable/SOURCE_CANDIDATE.json" "$bundle/SOURCE_CANDIDATE.json"
          cp "$stable/accepted-candidate.json" "$bundle/accepted-candidate.json"
          cp "$stable/stable-authority-manifest.json" "$bundle/stable-authority-manifest.json"
          cp build/reports/release-deployment.json "$bundle/release-deployment.json"
          node tools/server-scripts/resolve-branch-promotion-authority.ts create-release-manifest \
            --bundle "$stable" \
            --expected-candidate build/release/control/expected/SOURCE_CANDIDATE.json \
            --stable-run "${{ steps.stable-run.outputs.selection }}" \
            --deployment "$bundle/release-deployment.json" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --output "$bundle/release-authority-manifest.json"
      - name: Upload the release authority bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-authority-${{ github.sha }}
          path: build/release/control/release-authority/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  ensure-release-tag:
    name: Create or verify the immutable release tag
    needs: [release-deployment]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.16.0"
          cache: "npm"
      - name: Pin the canonical npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(node -p 'JSON.parse(require("node:fs").readFileSync("tools/registry/release-definition.registry.json", "utf8")).github.npmCliVersion')"
          npm install --global --no-audit --no-fund --ignore-scripts --registry=https://registry.npmjs.org/ "npm@${npm_version}"
          test "$(npm --version)" = "$npm_version"
      - name: Install release tooling dependencies
        run: npm ci --ignore-scripts
      - name: Create or verify the canonical tag at this release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-deployment.outputs.release_tag }}
        run: >-
          node tools/server-scripts/resolve-branch-promotion-authority.ts
          ensure-release-tag
          --repository "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG"
          --source-revision "$GITHUB_SHA"

  dispatch-release:
    name: Dispatch the tag-bound release workflow
    needs: [release-deployment, ensure-release-tag]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.16.0"
          cache: "npm"
      - name: Pin the canonical npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(node -p 'JSON.parse(require("node:fs").readFileSync("tools/registry/release-definition.registry.json", "utf8")).github.npmCliVersion')"
          npm install --global --no-audit --no-fund --ignore-scripts --registry=https://registry.npmjs.org/ "npm@${npm_version}"
          test "$(npm --version)" = "$npm_version"
      - name: Install release tooling dependencies
        run: npm ci --ignore-scripts
      - name: Dispatch the exact release commit and source run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-deployment.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release-deployment.outputs.release_version }}
          BOOTSTRAP_CANDIDATE: ${{ github.event.inputs.bootstrap_candidate || '' }}
        run: |
          set -euo pipefail
          args=(
            dispatch-release
            --repository "$GITHUB_REPOSITORY"
            --tag "$RELEASE_TAG"
            --source-revision "$GITHUB_SHA"
            --run-id "$GITHUB_RUN_ID"
            --run-attempt "$GITHUB_RUN_ATTEMPT"
            --source-event "$GITHUB_EVENT_NAME"
            --release-version "$RELEASE_VERSION"
          )
          if [[ -n "$BOOTSTRAP_CANDIDATE" ]]; then
            args+=(--bootstrap-candidate "$BOOTSTRAP_CANDIDATE")
          fi
          node tools/server-scripts/resolve-branch-promotion-authority.ts "${args[@]}"
