# ==============================================================================
# Meshrix Docker Compose
#
# Usage:
#   docker compose up -d
#   MESHRIX_BUILD_TARGET=runtime-ui MESHRIX_SERVER_WITH_UI=1 docker compose up -d --build
#   docker compose --profile format-convert up -d (optional converter service)
#
# The default build remains API-only. Select runtime-ui explicitly to build and
# serve the Vue Console. The service binds to 127.0.0.1.
#
# For production, place this behind a TLS-terminating reverse proxy and apply
# network isolation. See README.md for full guidance.
# ==============================================================================
services:
  meshrix-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${MESHRIX_BUILD_TARGET:-runtime}
    image: ${MESHRIX_IMAGE_NAME:-meshrix-server:local}
    container_name: ${MESHRIX_CONTAINER_NAME:-meshrix-server}
    restart: unless-stopped
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7228/api/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "${MESHRIX_BIND_ADDRESS:-127.0.0.1}:${MESHRIX_HOST_PORT:-7228}:7228"
    environment:
      MESHRIX_SERVER_HOST: 0.0.0.0
      MESHRIX_SERVER_PORT: 7228
      MESHRIX_SERVER_DATA_DIR: data
      MESHRIX_SERVER_WITH_UI: "${MESHRIX_SERVER_WITH_UI:-0}"
      MESHRIX_RUNTIME_CONFIG: ${MESHRIX_RUNTIME_CONFIG:-}
      MESHRIX_BOOTSTRAP_URL: http://${MESHRIX_ADVERTISED_HOST:-127.0.0.1}:${MESHRIX_HOST_PORT:-7228}
      MESHRIX_ADVERTISED_BASE_URL: http://${MESHRIX_ADVERTISED_HOST:-127.0.0.1}:${MESHRIX_HOST_PORT:-7228}
      MESHRIX_ACTIVE_SERVICE_URL: http://${MESHRIX_ADVERTISED_HOST:-127.0.0.1}:${MESHRIX_HOST_PORT:-7228}
    volumes:
      - meshrix-server-data:/app/data
      # Optional, read-only host Codex configuration:
      # - ${HOME}/.codex:/codex-home:ro

  # Optional file-parser/format-convert upstream service used by
  # docs/examples/file-parser-format-convert.upstream.json. Its build context
  # lives in the sibling Meshrix-Services repository, so this file references
  # the pre-built image; build it once from that checkout:
  #   cd ../Meshrix-Services/file-parser/format-convert && make image
  # The service stays on the internal Compose network, where the server
  # reaches it as http://format-convert:8080.
  format-convert:
    image: ${MESHRIX_FORMAT_CONVERT_IMAGE_NAME:-meshrix-format-convert:local}
    container_name: ${MESHRIX_FORMAT_CONVERT_CONTAINER_NAME:-meshrix-format-convert}
    restart: unless-stopped
    profiles:
      - format-convert
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  meshrix-server-data:
