# ==============================================================================
# LicoMesh Docker Compose
#
# Usage:
#   docker compose up -d
#   LICO_BUILD_TARGET=runtime-ui LICO_SERVER_WITH_UI=1 docker compose up -d --build
#
# The default build remains API-only. Select runtime-ui explicitly to build and
# serve the Vue Console. The service binds to 127.0.0.1.
#
# For production, place this behind a TLS-terminating reverse proxy and apply
# network isolation. See README.md for full guidance.
# ==============================================================================
services:
  licomesh-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${LICO_BUILD_TARGET:-runtime}
    image: ${LICO_IMAGE_NAME:-licomesh-server:local}
    container_name: ${LICO_CONTAINER_NAME:-licomesh-server}
    restart: unless-stopped
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7228/api/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "${LICO_BIND_ADDRESS:-127.0.0.1}:${LICO_HOST_PORT:-7228}:7228"
    environment:
      LICO_SERVER_HOST: 0.0.0.0
      LICO_SERVER_PORT: 7228
      LICO_SERVER_DATA_DIR: data
      LICO_SERVER_WITH_UI: "${LICO_SERVER_WITH_UI:-0}"
      LICO_RUNTIME_CONFIG: ${LICO_RUNTIME_CONFIG:-}
      LICO_BOOTSTRAP_URL: http://${LICO_ADVERTISED_HOST:-127.0.0.1}:${LICO_HOST_PORT:-7228}
      LICO_ADVERTISED_BASE_URL: http://${LICO_ADVERTISED_HOST:-127.0.0.1}:${LICO_HOST_PORT:-7228}
      LICO_ACTIVE_SERVICE_URL: http://${LICO_ADVERTISED_HOST:-127.0.0.1}:${LICO_HOST_PORT:-7228}
    volumes:
      - licomesh-server-data:/app/data
      # Optional, read-only host Codex configuration:
      # - ${HOME}/.codex:/codex-home:ro

volumes:
  licomesh-server-data:
