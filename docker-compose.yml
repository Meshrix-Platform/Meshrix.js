# ==============================================================================
# Meshrix.js Docker Compose
#
# Usage:
#   docker compose up -d
#   MESHRIX_BUILD_TARGET=runtime-ui MESHRIX_SERVER_WITH_UI=1 docker compose up -d --build
#   docker compose --profile format-convert up -d (optional converter service)
#   docker compose --profile skill-hub up -d --build (independent Skill Hub)
#
# The default build remains API-only. Select runtime-ui explicitly to build and
# serve the Vue Console. The service binds to 127.0.0.1.
#
# For production, place this behind a TLS-terminating reverse proxy and apply
# network isolation. See README.md for full guidance.
#
# This file is the development/source compose definition and is not the offline
# release artifact for enterprise single-node.
# ==============================================================================
services:
  meshrix-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${MESHRIX_BUILD_TARGET:-runtime}
    image: ${MESHRIX_IMAGE_NAME:-meshrix-server:local}
    pull_policy: ${MESHRIX_PULL_POLICY:-build}
    container_name: ${MESHRIX_CONTAINER_NAME:-meshrix-server}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_signal: SIGTERM
    stop_grace_period: 90s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7228/api/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "${MESHRIX_BIND_ADDRESS:-127.0.0.1}:${MESHRIX_HOST_PORT:-7228}:7228"
    environment:
      MESHRIX_SERVER_HOST: 0.0.0.0
      MESHRIX_SERVER_PORT: 7228
      MESHRIX_SERVER_DATA_DIR: data
      MESHRIX_SERVER_WITH_UI: "${MESHRIX_SERVER_WITH_UI:-0}"
      MESHRIX_RUNTIME_CONFIG: ${MESHRIX_RUNTIME_CONFIG:-}
      MESHRIX_BACKUP_ROOT: /app/backups
      MESHRIX_BOOTSTRAP_URL: http://${MESHRIX_ADVERTISED_HOST:-127.0.0.1}:${MESHRIX_HOST_PORT:-7228}
      MESHRIX_ADVERTISED_BASE_URL: http://${MESHRIX_ADVERTISED_HOST:-127.0.0.1}:${MESHRIX_HOST_PORT:-7228}
      MESHRIX_ACTIVE_SERVICE_URL: http://${MESHRIX_ADVERTISED_HOST:-127.0.0.1}:${MESHRIX_HOST_PORT:-7228}
    volumes:
      - meshrix-server-data:/app/data
      - meshrix-server-backups:/app/backups
      - meshrix-codex-home:/codex-home
      # Optional, read-only host Codex configuration:
      # - ${HOME}/.codex:/codex-home:ro
    networks:
      - meshrix-core

  # Optional operator-supplied format conversion service used by
  # docs/examples/file-parser-format-convert.upstream.json.
  # The service stays on the internal Compose network, where the server
  # reaches it as http://format-convert:8080.
  format-convert:
    image: ${MESHRIX_FORMAT_CONVERT_IMAGE_NAME:-meshrix-js-format-convert:local}
    container_name: ${MESHRIX_FORMAT_CONVERT_CONTAINER_NAME:-meshrix-format-convert}
    restart: unless-stopped
    profiles:
      - format-convert
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - meshrix-core

  # Independent Skill Hub service used by docs/examples/skill-hub.upstream.json.
  # Meshrix reaches it through the internal network as http://skill-hub:8080.
  skill-hub:
    build:
      context: ./services/skill-hub
      dockerfile: Dockerfile
    image: ${MESHRIX_SKILL_HUB_IMAGE_NAME:-meshrix-skill-hub:local}
    container_name: ${MESHRIX_SKILL_HUB_CONTAINER_NAME:-meshrix-skill-hub}
    restart: unless-stopped
    profiles:
      - skill-hub
    init: true
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PORT: 8080
      SKILL_HUB_DATA_ROOT: /var/lib/skill-hub
      MAX_REQUEST_BYTES: 2097152
      SKILL_HUB_AUTH_TOKEN: ${MESHRIX_SKILL_HUB_AUTH_TOKEN:-}
    volumes:
      - meshrix-skill-hub-data:/var/lib/skill-hub
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - meshrix-core

volumes:
  meshrix-server-data:
  meshrix-server-backups:
  meshrix-codex-home:
  meshrix-skill-hub-data:

networks:
  meshrix-core: {}
