<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="LicoMesh — Traceable Shared Workspace for AI Agents">
  <title>LicoMesh — Traceable Shared Workspace for AI Agents</title>

  <defs>
    <!-- Background: deep obsidian with faint blue undertone -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#060610"/>
    </linearGradient>

    <!-- Gold accent gradient -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#c9a96e"/>
      <stop offset="50%"  stop-color="#f0d28c"/>
      <stop offset="100%" stop-color="#a8893a"/>
    </linearGradient>

    <!-- Ice crystal blue gradient -->
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#4fc3f7"/>
      <stop offset="50%"  stop-color="#80deea"/>
      <stop offset="100%" stop-color="#26a8d8"/>
    </linearGradient>

    <!-- Prismatic refraction gradient (horizontal spectrum) -->
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"    stop-color="#c9a96e" stop-opacity="0.8"/>
      <stop offset="20%"   stop-color="#f0d28c" stop-opacity="0.6"/>
      <stop offset="40%"   stop-color="#80deea" stop-opacity="0.7"/>
      <stop offset="60%"   stop-color="#4fc3f7" stop-opacity="0.8"/>
      <stop offset="80%"   stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="100%"  stop-color="#c9a96e" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Crystal facet highlight -->
    <linearGradient id="facet" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow behind crystal -->
    <radialGradient id="crystalGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#4fc3f7" stop-opacity="0.06"/>
      <stop offset="60%"  stop-color="#c9a96e" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Text area subtle glow -->
    <radialGradient id="textGlow" cx="0.65" cy="0.5" r="0.35">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── Background ─────────────────────────────────────────────────────────── -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Ambient glow layers -->
  <circle cx="280" cy="200" r="240" fill="url(#crystalGlow)"/>
  <rect width="1200" height="400" fill="url(#textGlow)"/>

  <!-- ── Crystal Icon — centered at (280, 200) ───────────────────────────────── -->
  <g transform="translate(280,200)">

    <!-- Outer hexagonal frame (crystal form) -->
    <polygon
      points="0,-130 112.6,-65 112.6,65 0,130 -112.6,65 -112.6,-65"
      fill="none" stroke="url(#gold)" stroke-width="0.6" opacity="0.3"/>

    <!-- Second hexagon — rotated 30° (creates 12-pointed star overlay) -->
    <polygon
      points="0,-120 103.9,-60 103.9,60 0,120 -103.9,60 -103.9,-60"
      fill="none" stroke="url(#ice)" stroke-width="0.4" opacity="0.2"
      transform="rotate(30)"/>

    <!-- Crystal lattice lines — internal structure -->
    <!-- Vertical axis -->
    <line x1="0" y1="-95" x2="0" y2="95" stroke="url(#ice)" stroke-width="0.5" opacity="0.25"/>
    <!-- 60° axes -->
    <line x1="-82.3" y1="-47.5" x2="82.3" y2="47.5" stroke="url(#ice)" stroke-width="0.5" opacity="0.25"/>
    <line x1="-82.3" y1="47.5" x2="82.3" y2="-47.5" stroke="url(#ice)" stroke-width="0.5" opacity="0.25"/>

    <!-- Inner hexagon — crystal core -->
    <polygon
      points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30"
      fill="url(#facet)" stroke="url(#gold)" stroke-width="1.2" opacity="0.55"/>

    <!-- Crystal facet highlights (triangular faces) -->
    <polygon points="0,-60 52,-30 0,0" fill="#ffffff" opacity="0.02"/>
    <polygon points="52,-30 52,30 0,0" fill="#4fc3f7" opacity="0.02"/>
    <polygon points="0,60 -52,30 0,0" fill="#ffffff" opacity="0.015"/>

    <!-- Lattice nodes — where channels intersect -->
    <circle cx="0" cy="-60" r="2.5" fill="#80deea" opacity="0.5"/>
    <circle cx="52" cy="-30" r="2.5" fill="#c9a96e" opacity="0.5"/>
    <circle cx="52" cy="30" r="2.5" fill="#80deea" opacity="0.4"/>
    <circle cx="0" cy="60" r="2.5" fill="#c9a96e" opacity="0.5"/>
    <circle cx="-52" cy="30" r="2.5" fill="#80deea" opacity="0.4"/>
    <circle cx="-52" cy="-30" r="2.5" fill="#c9a96e" opacity="0.5"/>

    <!-- Central brilliant — the focused light point -->
    <circle r="5" fill="url(#gold)" opacity="0.7"/>
    <circle r="2.5" fill="#ffffff" opacity="0.6"/>

    <!-- Radial beams — extending from vertices along 6-fold axes -->
    <line x1="0" y1="-65" x2="0" y2="-105" stroke="url(#ice)" stroke-width="0.6" opacity="0.2"/>
    <line x1="56.3" y1="-32.5" x2="91" y2="-52.5" stroke="#c9a96e" stroke-width="0.6" opacity="0.2"/>
    <line x1="56.3" y1="32.5" x2="91" y2="52.5" stroke="url(#ice)" stroke-width="0.6" opacity="0.2"/>
    <line x1="0" y1="65" x2="0" y2="105" stroke="#c9a96e" stroke-width="0.6" opacity="0.2"/>
    <line x1="-56.3" y1="32.5" x2="-91" y2="52.5" stroke="url(#ice)" stroke-width="0.6" opacity="0.2"/>
    <line x1="-56.3" y1="-32.5" x2="-91" y2="-52.5" stroke="#c9a96e" stroke-width="0.6" opacity="0.2"/>

    <!-- Outer lattice ring — faint crystal boundary markers -->
    <g opacity="0.15" stroke="#80deea" stroke-width="0.6">
      <line x1="0" y1="-126" x2="0" y2="-130"/>
      <line x1="0" y1="126" x2="0" y2="130"/>
      <line x1="-109.1" y1="-63" x2="-112.6" y2="-65"/>
      <line x1="109.1" y1="-63" x2="112.6" y2="-65"/>
      <line x1="-109.1" y1="63" x2="-112.6" y2="65"/>
      <line x1="109.1" y1="63" x2="112.6" y2="65"/>
    </g>

  </g>

  <!-- ── Prismatic separator line ──────────────────────────────────────────── -->
  <rect x="460" y="158" width="1.5" height="84" fill="url(#prism)" opacity="0.4" rx="0.75"/>

  <!-- ── Wordmark: "LICOMESH" ──────────────────────────────────────────────── -->
  <text
    x="500" y="193"
    dominant-baseline="middle"
    font-family="'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="72"
    font-weight="200"
    letter-spacing="12"
    fill="#ede6d6">LICOMESH</text>

  <!-- ── Subtitle ──────────────────────────────────────────────────────────── -->
  <text
    x="502" y="242"
    font-family="'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="12.5"
    font-weight="300"
    letter-spacing="4.5"
    fill="#5a6a7a">TRACEABLE SHARED WORKSPACE FOR AI AGENTS</text>

  <!-- ── Bottom prismatic accent line ──────────────────────────────────────── -->
  <rect x="502" y="282" width="360" height="0.5" fill="url(#prism)" opacity="0.25" rx="0.25"/>

</svg>
